# Project managers: program status and risk from Jira, commits and PRs, with nudges they send themselves.
apiVersion: orgspec/v1
kind: Persona
metadata:
  id: project-manager
  name: Project manager
  version: 1.0.0
  owners: [ pm-process-owners ]
spec:
  eligibility:
    teams: []
  constitution:
    bundle: compiled/project-manager/1.0.0
    sha256: "sha256:b01c64abcc44be2ea73c75da9b3e60a9ef2f2ff8e894347bbbedb5bc20db7a91"
  mcp:
    - server: atlassian
      tools:
        [
          "getJiraIssue",
          "searchJiraIssuesUsingJql",
          "getConfluencePage",
          "searchConfluenceUsingCql",
          "createConfluencePage",
          "updateConfluencePage"
        ]
      confirm: [ "createConfluencePage", "updateConfluencePage" ]
    - server: slack
      tools: [ "conversations_history", "conversations_replies", "chat_post_message" ]
  views: [ programs, task-inbox, slack-summarizer, my-agents, decisions ]
