# MCP servers OrgSpec reaches. Claude Code only ever loads the OrgSpec gateway, which proxies these.
servers:
  atlassian:
    transport: http
    url: https://mcp.atlassian.com/v1/mcp
    hosts: [acme.atlassian.net]
    oauth: { scopes: [] }
  slack:
    transport: http
    url: https://mcp.slack.example.com/mcp # your Slack MCP server
    hosts: [acme.slack.com]
  ci:
    transport: stdio
    command: acme-ci-mcp # your CI system's MCP server
    args: [--readonly-logs]
    hosts: [ci.acme.io]
  hr:
    transport: http
    url: https://hr-mcp.acme.io/mcp
  calendar:
    transport: http
    url: https://calendar-mcp.acme.io/mcp
constants:
  cloudId: "00000000-0000-0000-0000-000000000000" # Atlassian cloud ID
# Override any logical operation when your server's tool names differ, for example:
# operations:
#   ci.listRuns: { tool: ci__builds_search, args: { project: $repo, branch: $branch } }
egressAllow: [github.com, "*.acme.io", acme.atlassian.net]
